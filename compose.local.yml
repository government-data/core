# The installation's local layer, over compose.yml and
# compose.prod.yml: the API's internal routes for the host's update daemon
# (quality-sdk's update agent). The documentation for the customers at /docs
# is the docs module's (quality-sdk decision 0002).
#
# It is the only port the API publishes, and only on 127.0.0.1: it cannot be
# reached from outside the machine. Each request brings the token of
# secrets/internal_token, which the installer generates. The API never gets
# docker.sock: the host is the one that updates.
name: quality-data

secrets:
  internal_token:
    file: ./secrets/internal_token

services:
  api:
    environment:
      QD_INTERNAL_ADDR: 0.0.0.0:9417
      QD_INTERNAL_TOKEN_FILE: /run/secrets/internal_token
    secrets:
      - internal_token
    ports:
      - "127.0.0.1:${QD_INTERNAL_PORT:-9417}:9417"
