dataset: clientes_juridicas
rules:
  - id: P-11
    field: "Patrimonio"
    check: "expression"
    fails: "abs(Activo - Pasivo - Patrimonio) > 1"
    dimension: "consistency"
    severity: major
    cause: capture
    alert: "Patrimonio ≠ activo − pasivo"
    origin: { process: MVP }

  - id: P-13
    field: "Patrimonio"
    check: "expression"
    fails: "Patrimonio < 0"
    dimension: "accuracy"
    severity: minor
    cause: capture
    alert: "Patrimonio negativo"
    origin: { process: MVP }
