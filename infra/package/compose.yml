# The core's compose for installations (decision 0080, point 2): the
# package's `compose.yml`, run by quality-sdk's update agent as
#
#   docker compose --project-name quality-data \
#     --project-directory /opt/quality-data/quality-data/current \
#     --file /opt/quality-data/quality-data/current/compose.yml \
#     --env-file /opt/quality-data/quality-data/.env up -d --no-build --wait
#
# with no profile and no second file. Its paths are the package's (this file
# at its root, beside infra/), not the repository's: tools/package.sh puts
# it there. Development keeps compose.yml, compose.override.yml and
# compose.prod.yml; a change of a service goes in infra/ once, and an
# override of compose.prod.yml in both.
#
# It is the production stack (compose.yml with compose.prod.yml) in one
# file, and Traefik's machine certificate (infra/traefik/certificate.yml,
# decision 0081). What belongs to one installation is never in the version
# folder but beside it, in QD_MODULE_DIR (/opt/quality-data/quality-data,
# required), which the installer writes into the .env (env.example):
#
#   secrets/   database_url and postgres_superuser_password, as Docker
#              secrets (readable by the containers' users: PostgreSQL's is
#              uid 70)
#   certs/     Traefik's default certificate (local.crt, local.key): the
#              customer's, or the installer's self-signed one
#   internal/  Traefik's watched folder (decision 0081): internal.yml, the
#              CA's machines-ca.crt, app-machine.pem (renewed in place);
#              the package's dynamic files are read-only inside it, at
#              package/
#   ca/        the installation's CA (`server ca-init`): the API's, to sign
#              the machines' certificates and to check PostgreSQL's, and the
#              installer's one-shots'
#   secrets/dolt-root-password, secrets/dolt-app-password
#              Dolt's root and the application user's passwords (decision
#              0080's amendment of 2026-11-24), made by the installer, or by
#              the update agent when missing (module.yaml's secrets), 0400
#              and the API's user's
#
#   secrets/rustfs-sts-issuer-access-key, secrets/rustfs-sts-issuer-secret-key
#              the lake's STS issuer's keys (decision 0091, point 4), made
#              the same way, critical keys; the API reads them as files
#
# The lake (decision 0091, point 4): the API reaches it at LAKE_ENDPOINT
# and its admin adapter at LAKE_ADMIN_URL, both from the .env and empty
# until the installation has a lake; it presents the application
# machine's certificate and trusts the installation's CA, which signs the
# lake's. The lake's root keys are made and kept by the core (0066 step 11).
#
# Dolt, the catalog (decisions 0021, 0080's amendment): infra/dolt with
# certificate.yml's overrides (TLS only, a client certificate of the installation's CA,
# the application machine's machine.pem copied at each start), on a network
# of its own with the API only, published nowhere. The API reaches it as
# `dolt` and verifies that name (ssl-mode=VERIFY_IDENTITY): the CA signs the
# application machine's certificate for its own name, PostgreSQL's alias on
# `backend`, and for `dolt` (ruled by the user 2026-11-24). It presents the
# same machine.pem, the password from its file.
#
# database_url is verify-full by POSTGRES_SERVER_NAME (decision 0082):
#   postgres://<APP_DB_USER>:<password>@<POSTGRES_SERVER_NAME>:5432/<POSTGRES_DB>?sslmode=verify-full&sslrootcert=/run/qd-ca/ca.crt
#
# The first start is not one `up` (decision 0082): ca-init, `up -d postgres`
# without waiting, the app-machine one-shot, this `up`, then the
# updater-certificate one-shot and internal/'s internal.yml and
# machines-ca.crt.
#
# The web entry point's certificate source is QD_TLS_MODE (decision 0087):
# `file` (the default) serves certs/local.crt and makes no ACME request;
# `acme` is Let's Encrypt by HTTP-01, with ACME_EMAIL. Traefik runs the
# static configuration machine/tls-source.sh writes from traefik.yml.
#
# The images are the agent's IMAGE_* (the signed index's digests).
name: quality-data

include:
  - path:
      - infra/traefik/docker-compose.yml
      - infra/traefik/certificate.yml
  # PostgreSQL with TLS and the machines' certificates (decisions 0066,
  # 0082): healthy only once the node agent's machine.pem is there.
  - path:
      - infra/postgres/docker-compose.yml
      - infra/postgres/tls.yml
  - infra/postgres/api.override.yml
  # Dolt; certificate.yml's overrides are written below, as that file
  # declares data-quality-edge external, which would stop this project
  # from creating it. Its paths are written from the repository's root, as
  # its stack runs with --project-directory .: here the package's.
  - path: infra/dolt/docker-compose.yml
    project_directory: .

networks:
  # The API's own network (decision 0083): Traefik and the API only, so the
  # API can trust Traefik's client certificate header (0066). It leaves
  # data-quality-edge, where other modules' services may be.
  api:
    name: data-quality-api
    internal: true
  # Dolt and the API only (decision 0080's amendment, point 9).
  catalog:
    name: data-quality-catalog
    internal: true

secrets:
  database_url:
    file: ${QD_MODULE_DIR:?set QD_MODULE_DIR to the module's directory}/secrets/database_url
  postgres_superuser_password:
    file: ${QD_MODULE_DIR:?set QD_MODULE_DIR to the module's directory}/secrets/postgres_superuser_password
  dolt_root_password:
    file: ${QD_MODULE_DIR:?set QD_MODULE_DIR to the module's directory}/secrets/dolt-root-password
  dolt_app_password:
    file: ${QD_MODULE_DIR:?set QD_MODULE_DIR to the module's directory}/secrets/dolt-app-password
  rustfs_sts_issuer_access_key:
    file: ${QD_MODULE_DIR:?set QD_MODULE_DIR to the module's directory}/secrets/rustfs-sts-issuer-access-key
  rustfs_sts_issuer_secret_key:
    file: ${QD_MODULE_DIR:?set QD_MODULE_DIR to the module's directory}/secrets/rustfs-sts-issuer-secret-key

services:
  traefik:
    command:
      - "--configFile=/run/qd-traefik/traefik.yml"
    environment:
      QD_TLS_MODE: ${QD_TLS_MODE:-file}
      ACME_EMAIL: ${ACME_EMAIL:-}
      TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_EMAIL: ${ACME_EMAIL:-}
    networks:
      edge:
      api:
      # The node agent's network (decision 0084): it reaches the internal
      # entry point by the VM's machine name, Traefik's alias here.
      default:
        aliases:
          - ${INTERNAL_DOMAIN:?set INTERNAL_DOMAIN to the VM's machine name}
    volumes:
      # Same targets as infra/traefik's files, so these replace theirs.
      - "${QD_MODULE_DIR:?set QD_MODULE_DIR to the module's directory}/internal:/etc/traefik/dynamic"
      - "./infra/traefik/dynamic:/etc/traefik/dynamic/package:ro"
      - "${QD_MODULE_DIR:?set QD_MODULE_DIR to the module's directory}/certs:/etc/traefik/certs:ro"

  postgres:
    environment:
      # From the secret, not the environment (as compose.prod.yml).
      POSTGRES_PASSWORD: ""
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_superuser_password
    secrets:
      - postgres_superuser_password

  api:
    image: ${IMAGE_API:-${API_IMAGE:?set IMAGE_API or API_IMAGE to a versioned image}}
    # The routers' resolver by the certificate source, `file` by default
    # (decision 0087), not development's `acme`.
    label_file: !override
      - ./infra/traefik/tls-source/${QD_TLS_MODE:-file}-api.labels
    # PostgreSQL's network, its own and Dolt's; never data-quality-edge
    # (0083).
    networks: !override
      - backend
      - api
      - catalog
    labels:
      - "traefik.docker.network=data-quality-api"
    environment:
      # Only Traefik reaches the API (0083), so its client certificate
      # header is believed: the machines' and the update agent's routes.
      INTERNAL_CLIENT_CERT_HEADER: trusted
      DATABASE_URL: ""
      DATABASE_URL_FILE: /run/secrets/database_url
      CA_CERT_FILE: /run/qd-ca/ca.crt
      CA_KEY_FILE: /run/qd-ca/ca.key
      # The catalog, its name verified (see above).
      DOLT_URL: "mysql://qd_app@dolt:3306?ssl-mode=VERIFY_IDENTITY&ssl-ca=/run/qd-node/ca.crt&ssl-cert=/run/qd-node/machine.pem&ssl-key=/run/qd-node/machine.pem"
      DOLT_PASSWORD_FILE: /run/secrets/dolt_app_password
      # The lake (see above); unset, no job gets lake credentials and
      # Settings → Lake says the lake is not reachable.
      LAKE_ENDPOINT: ${LAKE_ENDPOINT:-}
      LAKE_CA_FILE: ${LAKE_CA_FILE:-/run/qd-ca/ca.crt}
      LAKE_CLIENT_CERT_FILE: ${LAKE_CLIENT_CERT_FILE:-/run/qd-node/machine.pem}
      LAKE_ADMIN_URL: ${LAKE_ADMIN_URL:-}
      LAKE_ADMIN_CA_FILE: ${LAKE_ADMIN_CA_FILE:-/run/qd-ca/ca.crt}
      LAKE_ADMIN_CERT_FILE: ${LAKE_ADMIN_CERT_FILE:-/run/qd-node/machine.pem}
      RUSTFS_STS_ISSUER_ACCESS_KEY: ""
      RUSTFS_STS_ISSUER_ACCESS_KEY_FILE: /run/secrets/rustfs_sts_issuer_access_key
      RUSTFS_STS_ISSUER_SECRET_KEY: ""
      RUSTFS_STS_ISSUER_SECRET_KEY_FILE: /run/secrets/rustfs_sts_issuer_secret_key
    secrets:
      - database_url
      - dolt_app_password
      - rustfs_sts_issuer_access_key
      - rustfs_sts_issuer_secret_key
    volumes:
      - "${QD_MODULE_DIR:?set QD_MODULE_DIR to the module's directory}/ca:/run/qd-ca:ro"
      # The application machine's certificate, presented to Dolt.
      - "${QD_MACHINE_DIR:?set QD_MACHINE_DIR to the node agent's directory}:/run/qd-node:ro"
    read_only: true
    tmpfs:
      - /tmp

  # The application VM's node agent (decision 0084): it keeps the machine
  # certificate app-machine signed renewed over the renew route, as any
  # machine's agent, writing it aside then renamed into QD_MACHINE_DIR,
  # where PostgreSQL and Traefik take it without a restart. No join token:
  # the machine is installed. It reaches Traefik's internal entry point by
  # the VM's name (INTERNAL_DOMAIN), Traefik's alias on the project's
  # default network, which it shares with Traefik alone; never
  # data-quality-api (0083).
  node:
    image: ${IMAGE_API:-${API_IMAGE:?set IMAGE_API or API_IMAGE to a versioned image}}
    entrypoint: ["/usr/local/bin/qd-node"]
    # It exits non-zero only when a person must act (a refused renewal,
    # another CA, a certificate that ended); anything else it retries.
    restart: unless-stopped
    read_only: true
    environment:
      QD_AGENT_DIR: /run/qd-node
      QD_INTERNAL_URL: https://${INTERNAL_DOMAIN:?set INTERNAL_DOMAIN to the VM's machine name}:${TRAEFIK_INTERNAL_PORT:-9443}/api
      # How often it renews (8h by default).
      QD_RENEW_EVERY: ${QD_NODE_RENEW_EVERY:-8h}
      OBS_VM: ${OBS_VM:-}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - "${QD_MACHINE_DIR:?set QD_MACHINE_DIR to the node agent's directory}:/run/qd-node"
      - metrics:/run/qd-metrics

  web:
    image: ${IMAGE_WEB:-${WEB_IMAGE:?set IMAGE_WEB or WEB_IMAGE to a versioned image}}
    label_file: !override
      - ./infra/traefik/tls-source/${QD_TLS_MODE:-file}-web.labels

  # The catalog (decision 0080's amendment). Its first start on an empty
  # volume makes root, qd_app and the catalog's database (infra/dolt/init).
  dolt:
    image: ${IMAGE_DOLT:?set IMAGE_DOLT to a versioned image}
    # As infra/dolt/certificate.yml: TLS only, with the application
    # machine's certificate copied at each start (tls/entrypoint.sh).
    entrypoint: ["tini", "--", "/etc/qd/dolt/entrypoint.sh"]
    networks: !override
      - catalog
    environment:
      QD_DOLT_TLS_SOURCE: /run/qd-node
      QD_DOLT_TLS_DIR: /run/dolt-tls
      DOLT_ROOT_PASSWORD_FILE: /run/secrets/dolt_root_password
      DOLT_APP_PASSWORD_FILE: /run/secrets/dolt_app_password
    secrets:
      - dolt_root_password
      - dolt_app_password
    tmpfs:
      - /run/dolt-tls:mode=0700
    volumes:
      - ./infra/dolt/tls/entrypoint.sh:/etc/qd/dolt/entrypoint.sh:ro
      - ./infra/dolt/tls/config.yaml:/etc/dolt/servercfg.d/config.yaml:ro
      - "${QD_MACHINE_DIR:?set QD_MACHINE_DIR to the node agent's directory}:/run/qd-node:ro"
    # `dolt sql` has no client certificate: whether it listens.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3306"]
