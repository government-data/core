# Generated by tools/grafana/alerts.mjs from
# infra/observability/grafana/definition/alerts.json and crates/texts
# (decision 0072): change those and run `pnpm run gen:grafana`, never this file.
apiVersion: 1
contactPoints:
  - orgId: 1
    name: "qd-mail-and-api"
    receivers:
      - uid: "qd-mail"
        type: "email"
        settings:
          addresses: "$GRAFANA_ALERT_EMAILS"
          singleEmail: true
          subject: "{{ template \"qd.subject\" . }}"
          message: "{{ template \"qd.body\" . }}"
        disableResolveMessage: false
      - uid: "qd-api"
        type: "webhook"
        settings:
          url: "https://${INTERNAL_DOMAIN}/api/internal/machines/alerts"
          httpMethod: "POST"
        disableResolveMessage: false
  - orgId: 1
    name: "qd-api-heartbeat"
    receivers:
      - uid: "qd-api-heartbeat"
        type: "webhook"
        settings:
          url: "https://${INTERNAL_DOMAIN}/api/internal/machines/alerts"
          httpMethod: "POST"
        disableResolveMessage: false
