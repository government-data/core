# Development only (decision 0078, step 13): the lake admin adapter of the
# lake's dev stack (infra/rustfs/compose.dev.yml), which shares this
# Traefik's network namespace and listens on its loopback (127.0.0.1:9020),
# reached on 443 (ruling 71) by its name, lake-admin.<internal
# domain>. The adapter does its own mTLS (it answers the API's certificate
# alone), so its TLS is passed through, routed by SNI before any HTTP
# router of the entry point sees it (tools/verify/lake_admin_edge.sh).
# Empty unless QD_LAKE_ADMIN_DEV is `1`, which only compose.override.yml
# sets. Where the lake has its own machines, the adapter runs there, next
# to its gate (step 16).
{{ if eq (env "QD_LAKE_ADMIN_DEV") "1" }}
{{ $internal := env "INTERNAL_DOMAIN" | default "internal.localhost" }}
tcp:
  routers:
    lake-admin-dev:
      rule: "HostSNI(`lake-admin.{{ $internal }}`)"
      entryPoints: [websecure]
      tls:
        passthrough: true
      service: lake-admin-dev
  services:
    lake-admin-dev:
      loadBalancer:
        servers:
          - address: "127.0.0.1:9020"
{{ end }}
