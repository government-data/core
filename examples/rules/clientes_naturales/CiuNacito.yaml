dataset: clientes_naturales
rules:
  - id: V-PN-35
    field: "CiuNacito"
    check: "domain"
    not_in: { "list": "departamentos" }
    severity: major
    cause: capture
    alert: "Departamento en ciudad"
    origin: { process: KNIME, node: "#1605" }

  - id: V-PN-36
    field: "CiuNacito"
    check: "placeholder"
    values: ["ACTUALIZAR"]
    severity: major
    cause: capture
    alert: "Actualizar"
    origin: { process: KNIME, node: "#1605" }

  - id: V-PN-37
    field: "CiuNacito"
    check: "required"
    severity: blocking
    cause: capture
    alert: "Campo vacío"
    origin: { process: KNIME, node: "#1605" }
