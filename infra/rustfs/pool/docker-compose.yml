# A node of a lake pool (decision 0029, points 5 and 6; 0066 step 11, the
# user's rulings of 2026-11-13 and 2026-11-14): one server of role `lake`,
# one of the at least four a person defined in Settings → Lake. A server
# gets this file from the install endpoint, against its join token, which
# names the node, with the files it names, and `infra/join/join.sh` writes
# them into its directory (QD_JOIN_DIR, /opt/qd/lake) and starts it:
#
#   compose.yml      this file
#   drives.yml       written by join.sh: each drive (--drive PATH, as many as
#                    the pool says) mounted at /data/<n>
#   peers.yml        written by join.sh: the other nodes' names (and the
#                    replica's) at the addresses the server's DNS gave
#   pool.env         the pool's layout as the application derived it:
#                    RUSTFS_VOLUMES (every node's drives on the peers' port),
#                    the same on every node, and the replica's gate if known
#   root-keys.env    the lake's root keys, the same on every node (0600)
#   rustfs-tls.sh    infra/rustfs/tls/entrypoint.sh
#   lake-gate.sh     infra/rustfs/gate/entrypoint.sh
#   lake-proxy.sh    infra/worker/lake/entrypoint.sh
#   lake.alloy       infra/observability/alloy/lake.alloy (0071)
#   ca.crt, machine/, join/token, otlp-token, .env   as for the replica
#
# - `node`, the agent, as the replica's: it joins once with the token, under
#   the node's name, and renews the certificate every 8 hours.
# - `rustfs` listens on RUSTFS_PEER_PORT (9010) for its peers alone,
#   published on the server: the pool's nodes reach each other directly,
#   with client certificates of the installation's CA required
#   (RUSTFS_SERVER_MTLS_ENABLE=1; rustfs-tls.sh writes client_cert.pem too,
#   QD_RUSTFS_TLS_CLIENT). It resolves its own name, and the replication's
#   alias, to its own loopback (a node that resolves its own name elsewhere
#   never forms the pool), and its peers' names to the addresses join.sh
#   got from the server's DNS (peers.yml: Docker's resolver on a compose
#   network does not pass a one-label name on to it). Its restart policy
#   lets the nodes come one at a time: a node alone waits for the format's
#   quorum, and the pool forms when all are up. With the profile `metrics`,
#   it pushes its metrics over OTLP to Alloy, in its namespace (0071).
# - `gate`, as the replica's, on 9000, in front of RustFS, presenting the
#   node's certificate to it.
# - `replication-proxy` (profile `replication`, when the replica's gate is
#   known): in RustFS's network namespace, plain HTTP on 127.0.0.1:9100,
#   where every node maps `qd-lake-replication`, presenting the node's
#   certificate to the replica's gate (ruling 5). It is the remote target
#   the application sets, the same for every node. It runs under Alloy's
#   loop, so it follows RustFS into a new namespace when RustFS restarts.
# The object data cache (decision 0028, amended 2026-11-17; verified with
# tools/verify/rustfs_cache.sh): whole objects up to 10 MiB kept in memory,
# keyed by their version, so never stale. RustFS 1.0.5 has no metadata cache
# (RUSTFS_OBJECT_CACHE_* are ignored). Each may be set in the node's .env
# (join.sh keeps the lines a person adds):
#   RUSTFS_OBJECT_DATA_CACHE_ENABLE          true (false turns it off)
#   RUSTFS_OBJECT_DATA_CACHE_MODE            fill_materialize_enabled; RustFS's
#                                            own default, fill_buffered_only,
#                                            fills almost nothing
#   RUSTFS_OBJECT_DATA_CACHE_MAX_BYTES       268435456 (256 MiB); the process
#                                            grows up to ~170 MiB above it while
#                                            filling, so leave the node room
#   RUSTFS_OBJECT_DATA_CACHE_MAX_ENTRY_BYTES 10485760 (RustFS fills no larger)
#   RUSTFS_OBJECT_DATA_CACHE_TTL_SECS        300
# The root keys are used only to install: join.sh makes the platform's admin
# user once per lake, on the first node that finds the pool formed.
name: qd-lake

services:
  node:
    image: ${QD_NODE_IMAGE:-qd-worker}
    entrypoint: ["/usr/local/bin/qd-node"]
    restart: unless-stopped
    read_only: true
    user: "10001:10001"
    environment:
      QD_AGENT_DIR: /var/lib/qd-node
      QD_PUBLIC_URL: ${QD_PUBLIC_URL:?set QD_PUBLIC_URL}
      QD_INTERNAL_URL: ${QD_INTERNAL_URL:-https://${INTERNAL_DOMAIN:-internal.${APP_DOMAIN}}/api}
      QD_MACHINE_NAME: ${QD_MACHINE_NAME:?set QD_MACHINE_NAME}
      QD_JOIN_TOKEN_FILE: /run/qd-join/token
      QD_CA_SHA256: ${QD_CA_SHA256:?set QD_CA_SHA256}
      QD_CA_FILE: /run/qd-ca/ca.crt
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - ./machine:/var/lib/qd-node
      - ./join:/run/qd-join
      - ./ca.crt:/run/qd-ca/ca.crt:ro
      # Its metrics file (decision 0071, point 9), for the machine's Alloy
      # (step 4); the image's folder is writable by its user and RustFS's.
      - metrics:/run/qd-metrics

  rustfs:
    image: ${RUSTFS_IMAGE:-rustfs/rustfs:1.0.5}
    restart: unless-stopped
    init: true
    entrypoint: ["/etc/qd/rustfs/entrypoint.sh"]
    command: ["server", "--address", ":9010"]
    env_file: [./root-keys.env, ./pool.env]
    environment:
      RUSTFS_OBS_LOGGER_LEVEL: ${RUSTFS_LOG_LEVEL:-warn}
      # The object data cache: see this file's header.
      RUSTFS_OBJECT_DATA_CACHE_ENABLE: ${RUSTFS_OBJECT_DATA_CACHE_ENABLE:-true}
      RUSTFS_OBJECT_DATA_CACHE_MODE: ${RUSTFS_OBJECT_DATA_CACHE_MODE:-fill_materialize_enabled}
      RUSTFS_OBJECT_DATA_CACHE_MAX_BYTES: ${RUSTFS_OBJECT_DATA_CACHE_MAX_BYTES:-268435456}
      RUSTFS_OBJECT_DATA_CACHE_MAX_ENTRY_BYTES: ${RUSTFS_OBJECT_DATA_CACHE_MAX_ENTRY_BYTES:-10485760}
      RUSTFS_OBJECT_DATA_CACHE_TTL_SECS: ${RUSTFS_OBJECT_DATA_CACHE_TTL_SECS:-300}
      RUSTFS_TLS_PATH: /run/rustfs-tls
      RUSTFS_TLS_RELOAD_ENABLE: "1"
      RUSTFS_TLS_RELOAD_INTERVAL: "30"
      RUSTFS_SERVER_MTLS_ENABLE: "1"
      QD_RUSTFS_TLS_SOURCE: /run/qd-node
      QD_RUSTFS_TLS_TRUST_CA: "1"
      QD_RUSTFS_TLS_CLIENT: "1"
      # Its metrics (decision 0071, step 4), when join.sh turns them on
      # (QD_RUSTFS_METRICS, with --metrics-url): pushed over OTLP every 30 s
      # to its own name, its loopback, where Alloy listens in its network
      # namespace, over HTTPS checked against the CA, with the node's token
      # (read by rustfs-tls.sh, so it is in no setting). No traces, no logs.
      RUSTFS_OBS_ENDPOINT: https://${QD_MACHINE_NAME:?set QD_MACHINE_NAME}:4318
      RUSTFS_OBS_METRICS_EXPORT_ENABLED: ${QD_RUSTFS_METRICS:-false}
      RUSTFS_OBS_TRACES_EXPORT_ENABLED: "false"
      RUSTFS_OBS_LOGS_EXPORT_ENABLED: "false"
      RUSTFS_OBS_METER_INTERVAL: "30"
      RUSTFS_OBS_TLS_CA_FILE: /run/qd-node/ca.crt
      QD_RUSTFS_OBS_TOKEN_FILE: /run/qd-otlp/token
    extra_hosts:
      - "${QD_MACHINE_NAME:?set QD_MACHINE_NAME}:127.0.0.1"
      - "qd-lake-replication:127.0.0.1"
    tmpfs:
      - /run/rustfs-tls:uid=10001,gid=10001,mode=0700
    volumes:
      - ./rustfs-tls.sh:/etc/qd/rustfs/entrypoint.sh:ro
      - ./machine:/run/qd-node:ro
      - ./otlp-token:/run/qd-otlp/token:ro
    ports:
      - "${RUSTFS_PEER_BIND:-0.0.0.0}:9010:9010"
    networks: [lake, default]
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9010"]
      interval: 10s
      retries: 40

  gate:
    image: ${TRAEFIK_IMAGE:-traefik:v3.6}
    restart: unless-stopped
    init: true
    user: "10001:10001"
    entrypoint: ["/etc/qd/gate/entrypoint.sh"]
    environment:
      QD_MACHINE_NAME: ${QD_MACHINE_NAME:?set QD_MACHINE_NAME}
      QD_LAKE_CHECK_URL: ${QD_LAKE_CHECK_URL:-https://${INTERNAL_DOMAIN:-internal.${APP_DOMAIN}}:${TRAEFIK_LAKEGATE_PORT:-9444}/api/internal/machines/lake/check}
      QD_GATE_UPSTREAM: https://rustfs:9010
      QD_GATE_READ_TIMEOUT: 0s
    tmpfs:
      - /run/qd-gate:uid=10001,gid=10001,mode=0700
    volumes:
      - ./lake-gate.sh:/etc/qd/gate/entrypoint.sh:ro
      - ./machine:/run/qd-node:ro
    ports:
      - "${RUSTFS_BIND:-0.0.0.0}:${RUSTFS_PORT:-9000}:9000"
    networks: [lake, default]
    # Started, not healthy: a node's RustFS answers only once the pool has
    # formed, and `up -d` must not wait for the other servers.
    depends_on:
      rustfs:
        condition: service_started

  replication-proxy:
    image: ${TRAEFIK_IMAGE:-traefik:v3.6}
    profiles: [replication]
    restart: unless-stopped
    init: true
    user: "10001:10001"
    network_mode: "service:rustfs"
    # When RustFS restarts, Docker leaves the proxy in its old namespace,
    # its loopback alone, where RustFS no longer reaches it
    # (tools/verify/rustfs_pool_replication.sh): so it runs under Alloy's
    # loop below, which ends it once its namespace has no other interface
    # (with TERM: the proxy stops in seconds), and its restart policy starts
    # it again in RustFS's new one.
    entrypoint:
      - /bin/sh
      - -c
      - |
        /etc/qd/lake/entrypoint.sh "$$@" &
        pid=$$!
        trap 'kill -TERM $$pid; wait $$pid; exit' TERM INT
        while kill -0 $$pid 2>/dev/null; do
          if [ "$$(grep -c : /proc/net/dev)" -le 1 ]; then
            echo "qd: RustFS restarted, its network namespace is gone: the proxy restarts to join the new one" >&2
            kill -TERM $$pid
            wait $$pid
            exit 1
          fi
          sleep 15 &
          wait $$!
        done
        wait $$pid
      - lake-proxy
    environment:
      QD_LAKE_GATE: ${QD_LAKE_REPLICA_GATE:-}
      QD_LAKE_LISTEN: 127.0.0.1:9100
      QD_LAKE_LISTEN_TLS: "0"
      QD_LAKE_HTTP1_ONLY: "1"
    tmpfs:
      - /run/qd-lake:uid=10001,gid=10001,mode=0700
    volumes:
      - ./lake-proxy.sh:/etc/qd/lake/entrypoint.sh:ro
      - ./machine:/run/qd-node:ro

  # Alloy (decision 0071, step 4), with the profile `metrics` (join.sh turns
  # it on when its command names --metrics-url): it reads the agent's
  # metrics file, receives RustFS's push and pushes them to Mimir with
  # lake.alloy, as the agent's user, presenting the machine's certificate.
  # It is in RustFS's network namespace, as RustFS resolves its own name to
  # its loopback (the certificate names the machine): its own server and
  # RustFS's receiver (TLS and the node's token required) on that loopback
  # alone, reached only from RustFS's namespace; no port published. The
  # observability server's name is RustFS's to resolve (metrics.yml). It
  # also reads the machine's metrics (decision 0072, step 2): each drive at
  # /host/watch/drive<n> (metrics.yml, as join.sh writes it from --drive)
  # and the host's /proc/1/net, both read-only; that file is the host's
  # namespace's although Alloy is in RustFS's.
  alloy-volume:
    image: ${ALLOY_IMAGE:-grafana/alloy:v1.21.3}
    profiles: [metrics]
    user: "0:0"
    entrypoint: ["/bin/sh", "-c", '[ "$$(stat -c %u /data)" = 10001 ] || chown 10001:10001 /data']
    volumes:
      - alloy-data:/data

  alloy:
    image: ${ALLOY_IMAGE:-grafana/alloy:v1.21.3}
    profiles: [metrics]
    user: "10001:10001"
    restart: unless-stopped
    read_only: true
    # No capability, none gained (decision 0072, point 2, as V1 ran it).
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp
    # When RustFS restarts, Docker gives it a new network namespace and
    # leaves Alloy in the old one, its loopback alone (seen with Docker
    # 29.4.1, tools/verify/metrics_rustfs_push.sh): so Alloy runs under this
    # loop, which ends it once its namespace has no other interface, and its
    # restart policy starts it again in RustFS's new one. There the loop ends
    # Alloy with KILL: on TERM Alloy would wait its remote write's fixed
    # one-minute flush deadline with Mimir out of reach and send nothing, the
    # samples of that time lost either way (decision 0071, the user's ruling
    # of 2026-11-16). docker stop still sends TERM, and Alloy flushes.
    entrypoint:
      - /bin/sh
      - -c
      - |
        /bin/alloy "$$@" &
        pid=$$!
        trap 'kill -TERM $$pid; wait $$pid; exit' TERM INT
        while kill -0 $$pid 2>/dev/null; do
          if [ "$$(grep -c : /proc/net/dev)" -le 1 ]; then
            echo "qd: RustFS restarted, its network namespace is gone: Alloy restarts to join the new one" >&2
            kill -KILL $$pid
            wait $$pid
            exit 1
          fi
          sleep 15 &
          wait $$!
        done
        wait $$pid
      - alloy
    command:
      - run
      - --server.http.listen-addr=127.0.0.1:12345
      - --storage.path=/var/lib/qd-alloy
      - --disable-reporting
      - /etc/qd-alloy
    environment:
      METRICS_PUSH_URL: ${METRICS_PUSH_URL:-}
      METRICS_CA_FILE: /run/qd-node/ca.crt
      METRICS_CERT_FILE: /run/qd-node/machine.pem
      OBS_VM: ${OBS_VM:-dev}
      OTLP_TOKEN_FILE: /run/qd-otlp/token
    volumes:
      - alloy-data:/var/lib/qd-alloy
      - ./machine:/run/qd-node:ro
      - metrics:/run/qd-metrics:ro
      - ./lake.alloy:/etc/qd-alloy/lake.alloy:ro
      - ./otlp-token:/run/qd-otlp/token:ro
      # The host's interfaces: its init's network files alone, never the
      # whole /proc (0072, point 2 as amended on 2026-11-16).
      - /proc/1/net:/host/proc1/net:ro
    network_mode: "service:rustfs"
    depends_on:
      alloy-volume:
        condition: service_completed_successfully
      rustfs:
        condition: service_started

networks:
  # RustFS and its gate; RustFS's other network is its way to its peers and,
  # for the proxy in its namespace, to the replica's gate.
  lake:
    internal: true

volumes:
  metrics:
  # What Alloy has not pushed yet (0071, point 5).
  alloy-data:
