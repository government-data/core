# The core's manifest for quality-sdk (decision 0080, point 1): the module
# `quality-data`. tools/package.sh copies it into the package with
# `version` from version.txt; the 0.0.0 here is never published.
name: quality-data
version: 0.0.0

# Each must have a running container, besides their Compose healthchecks.
# No `checks` until the API's image has a command that answers.
health:
  services: [traefik, postgres, api, node, web, dolt]

# What a backup before every update covers (the critical pieces).
data:
  databases:
    # POSTGRES_DB in the .env (infra/package/env.example).
    - name: quality_data
      critical: true
  volumes:
    # The key of the Settings secrets (LDAP, mail, OAuth).
    - name: settings-key
      service: api
      path: /var/lib/quality-data/settings
      critical: true
    - name: letsencrypt
      service: traefik
      path: /letsencrypt
      critical: false
    - name: metrics
      service: api
      path: /run/qd-metrics
      critical: false
    # The catalog: its databases, users and grants (decision 0080's
    # amendment); a copy of the running container's directory restores to
    # the same catalog (tools/verify/dolt_volume_copy.sh).
    - name: dolt-data
      service: dolt
      path: /var/lib/dolt
      critical: true
  # Under /opt/quality-data/quality-data/: the installation's .env (its
  # passwords, names and image digests; restored with the database it
  # matches), its CA and the secrets (infra/package/compose.yml).
  keys:
    - path: .env
      critical: true
    - path: ca/ca.crt
      critical: true
    - path: ca/ca.key
      critical: true
    - path: secrets/database_url
      critical: true
    - path: secrets/postgres_superuser_password
      critical: true

# Dolt's root and application user's passwords (decision 0080's
# amendment), the lake's STS issuer's keys and the OIDC signing keys: made
# by the update agent when missing, before the start (an installation from
# before them), owned by the API's user, which reads them; Dolt runs as
# root. Backed up as critical keys.
secrets:
  uid: 65532
  generate:
    - name: dolt-root-password
    - name: dolt-app-password
    # The lake's STS issuer (decision 0091, point 4): the API's keys for
    # the jobs' lake credentials, never written by a person.
    - name: rustfs-sts-issuer-access-key
      bytes: 16
    - name: rustfs-sts-issuer-secret-key
    # The OIDC provider's signing keys (quality-sdk decision 0012, ruling
    # 7): PKCS#8 in base64, as `server oidc-keygen` prints them. Made once
    # and kept; a key kind needs agent 0.4.0.
    - name: oidc-signing-key
      kind: ed25519
    - name: oidc-signing-key-es256
      kind: p256

# No `drain`: the core counts its own work (it is not one of the modules it
# asks).
