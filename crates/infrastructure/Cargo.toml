[package]
name = "infrastructure"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# The infrastructure layer implements the domain's ports (adapters). It depends
# on `domain` (to know its port contracts) and on external
# drivers — `sqlx` for Postgres, `async-trait` to implement the async
# `HealthCheck` port. It never depends on `application` or
# `api`: dependencies point inward.
[dependencies]
domain.workspace = true
auth-gateway.workspace = true
# The login rate limit's settings type (`auth_config`).
http-kit.workspace = true
# The platform: the Postgres adapter of its repository.
platform.workspace = true
# The IAM policies the repository stores.
iam.workspace = true
tenancy.workspace = true
chrono.workspace = true
ldap3.workspace = true
lettre.workspace = true
aes-gcm.workspace = true
tracing.workspace = true
async-trait.workspace = true
sqlx.workspace = true
# The argon2 adapter implements the `PasswordHasher` port. `tokio` is a real
# dependency here (not just for tests): the adapter offloads the CPU-bound argon2
# work to `spawn_blocking` so it never stalls the async runtime.
argon2.workspace = true
# `sync`: the broadcaster of Postgres's notices (`engine_events`).
tokio = { workspace = true, features = ["sync"] }
# OAuth/OIDC adapters: `reqwest` for the token/userinfo HTTP calls, `sha2` +
# `base64` for the PKCE `S256` challenge and id_token payload decoding, and
# `serde`/`serde_json` for parsing provider responses.
reqwest.workspace = true
sha2.workspace = true
# The modules' migration seam, filled here with PostgreSQL (module_migrations).
contracts.workspace = true
base64.workspace = true
# AWS Signature Version 4 for RustFS's STS, catalog and bucket.
sigv4.workspace = true
# RustFS STS answers (rustfs_sts.rs).
roxmltree.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
ring.workspace = true
# The installation's CA (src/ca, decision 0066): building and signing
# certificates, reading them and the machines' signing requests.
rcgen.workspace = true
x509-parser.workspace = true
time.workspace = true

# Test-only: `#[tokio::test]` still needs the macros; the runtime itself is now a
# normal dependency above. `testkit` spins up the ephemeral Postgres the
# `tests/*_it.rs` integration suites run against.
[dev-dependencies]
tokio.workspace = true
testkit.workspace = true
platform.workspace = true
serde_json.workspace = true
# The CA's tests: verifying what it signs as rustls would, and an RSA request.
rustls-webpki.workspace = true
rustls-pki-types.workspace = true
rsa.workspace = true
rand.workspace = true
