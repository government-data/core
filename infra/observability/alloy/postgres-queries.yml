# The queries of Alloy's PostgreSQL exporter (app-postgres.alloy; decision
# 0071, points 8 and 10), in place of its defaults: statistics only, by
# database and state. Each metric is <query name>_<column>.
pg_stat_database:
  query: >-
    SELECT datname, numbackends, xact_commit, xact_rollback, deadlocks
    FROM pg_stat_database WHERE datname IS NOT NULL
  metrics:
    - datname:
        usage: LABEL
        description: The database
    - numbackends:
        usage: GAUGE
        description: Sessions connected to it
    - xact_commit:
        usage: COUNTER
        description: Transactions committed in it
    - xact_rollback:
        usage: COUNTER
        description: Transactions rolled back in it
    - deadlocks:
        usage: COUNTER
        description: Deadlocks detected in it

pg_stat_activity:
  query: >-
    SELECT datname, COALESCE(state, '') AS state, count(*) AS count
    FROM pg_stat_activity WHERE datname IS NOT NULL GROUP BY datname, state
  metrics:
    - datname:
        usage: LABEL
        description: The database
    - state:
        usage: LABEL
        description: The sessions' state
    - count:
        usage: GAUGE
        description: Sessions in that state
