name: CI

# Lint + test + build for the knime-orchestador monorepo. The pipeline is split into a
# Rust `backend` job and a pnpm `frontend` job, and the `check` job gates each
# so a PR that only touches one stack never compiles the other. Dependency
# caches (cargo + pnpm) keep repeat runs fast.
#
# GitHub's minutes are counted per job and rounded up to the minute: the light
# work (what changed, secrets, audit) goes together in `check`, and the heavy
# work (`backend`, `frontend`) runs where the repository variable `CI_RUNNER`
# says — `["self-hosted","linux","x64","orq"]` with the ephemeral runners of
# infra/aws/ci; without it, on GitHub's.

on:
  # Only on PRs: they are merged rebased onto main and with a green CI, so what
  # reaches main is already tested (running it again was 35 % of the minutes).
  pull_request:
  # Weekly re-audit of dependencies: a vulnerability disclosed against an
  # unchanged dependency is caught even when no one pushes.
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

# Cancel superseded runs on the same ref (e.g. a new push to an open PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Which stacks the PR touches (to skip the heavy jobs that it does not), the
  # secret scan and the dependency audit, in a single job: each job costs at
  # least a minute.
  check:
    # CI_RUNNER_LIVIANO (like CI_RUNNER) sends it to the AWS runners when
    # GitHub has no minutes; without it, on GitHub's.
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LIVIANO || '"ubuntu-latest"') }}
    # On a PR, paths-filter asks GitHub's API for the list of files.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      image-api: ${{ steps.filter.outputs.image-api }}
      image-web: ${{ steps.filter.outputs.image-web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so gitleaks scans every commit, not just the tip.
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            backend:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rustfmt.toml'
              - 'clippy.toml'
              - 'openapi.json'
              - 'packages/api-client/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'apps/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig*.json'
              - 'eslint.config.js'
              - '.prettierrc.json'
              - '.prettierignore'
              - '.npmrc'
              - 'infra/observability/grafana/**'
              - 'tools/grafana/**'
              - 'crates/quality/charts/**'
              - 'crates/quality/src/charts.rs'
              - '.github/workflows/ci.yml'
            # What goes into each image: a broken Dockerfile fails the PR.
            image-api:
              - 'infra/docker/api.Dockerfile'
              - '.dockerignore'
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
            image-web:
              - 'infra/docker/web.Dockerfile'
              - 'infra/web/**'
              - '.dockerignore'
              - 'apps/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig*.json'
              - '.github/workflows/ci.yml'
            dependencies:
              - 'Cargo.lock'
              - 'deny.toml'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'

      # Secret scan: gitleaks over the full history, ungated — a secret can be
      # introduced in any file. Fake credentials in tests and .env.example are
      # allowlisted in .gitleaks.toml.
      - name: Run gitleaks
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          curl -sSL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --verbose

      # Dependency vulnerability audit: when a PR changes the dependencies, and
      # every week (a CVE can be disclosed against an unchanged dependency).
      # Justified, dated exceptions live in deny.toml (Rust) and pnpm's audit
      # config (JS); see deny.toml for the process.
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        if: github.event_name != 'pull_request' || steps.filter.outputs.dependencies == 'true'
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        if: github.event_name != 'pull_request' || steps.filter.outputs.dependencies == 'true'
        with:
          tool: cargo-deny
      - name: cargo-deny (advisories)
        if: github.event_name != 'pull_request' || steps.filter.outputs.dependencies == 'true'
        run: cargo deny check advisories
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: github.event_name != 'pull_request' || steps.filter.outputs.dependencies == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: github.event_name != 'pull_request' || steps.filter.outputs.dependencies == 'true'
        with:
          node-version: 22
      - name: pnpm audit (high+critical)
        if: github.event_name != 'pull_request' || steps.filter.outputs.dependencies == 'true'
        # It audits the lockfile: nothing needs installing.
        run: pnpm audit --audit-level high

  # Rust backend: format, lint, test, build across the whole Cargo workspace.
  # Also the API's contract: it regenerates the OpenAPI spec from the backend
  # and the TypeScript client from the spec, and fails if they differ from
  # what is in the repository (with the same build).
  backend:
    needs: check
    if: ${{ needs.check.outputs.backend == 'true' }}
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    env:
      # In CI incremental builds and debug info are no use: they only take
      # disk (and cache).
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format
        run: cargo fmt --all -- --check
      # A new migration only adds: if an update does not start, the previous
      # version comes back over the already migrated database.
      - name: Migrations (expand/contract)
        run: cargo xtask migrations
      # No file past its hard limit: Rust 800 lines, TypeScript 600 (0034).
      # Functions are checked by Clippy and ESLint.
      - name: File sizes
        run: cargo xtask sizes
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Build
        run: cargo build --workspace --all-targets --locked
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Regenerate the API spec and client
        run: pnpm run gen:api
      - name: Fail if the spec or client is out of date
        run: git diff --exit-code -- openapi.json packages/api-client/src/schema.ts

  # pnpm frontend: lint, prettier check, test, build across the pnpm workspace.
  frontend:
    needs: check
    if: ${{ needs.check.outputs.frontend == 'true' }}
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # action-setup reads the pinned pnpm version from package.json
      # (packageManager) and must run before setup-node so the pnpm store cache
      # can resolve.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Format check
        run: pnpm run format:check
      - name: Test
        run: pnpm run test
      - name: Build
        run: pnpm run build
      # Generated from infra/observability/grafana/definition; fails on a
      # changed or new file the commit does not carry.
      - name: Fail if the Grafana dashboards are out of date
        run: pnpm run check:grafana

  # The images, built as a release builds them but not pushed: a Dockerfile
  # that no longer matches the workspace fails here, not at release time.
  # On GitHub's runners (they have Docker and the Actions cache), with no
  # secrets: the token only reads.
  image-api:
    needs: check
    if: ${{ needs.check.outputs.image-api == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the API image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/api.Dockerfile
          push: false
          cache-from: type=gha,scope=image-api
          cache-to: type=gha,scope=image-api,mode=max

  image-web:
    needs: check
    if: ${{ needs.check.outputs.image-web == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/web.Dockerfile
          push: false
          cache-from: type=gha,scope=image-web
          cache-to: type=gha,scope=image-web,mode=max

  # Single required status check for branch protection: green when every
  # affected job passed. Skipped stacks (unaffected) do not fail the gate.
  ci:
    if: always()
    needs: [check, backend, frontend, image-api, image-web]
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LIVIANO || '"ubuntu-latest"') }}
    steps:
      - name: Aggregate result
        run: |
          # What changed, the secrets and the audit always run and must pass.
          if [ "${{ needs.check.result }}" != "success" ]; then
            echo "check job did not succeed"; exit 1
          fi
          for stack in backend frontend image-api image-web; do
            case "$stack" in
              backend) result="${{ needs.backend.result }}" ;;
              frontend) result="${{ needs.frontend.result }}" ;;
              image-api) result="${{ needs.image-api.result }}" ;;
              image-web) result="${{ needs.image-web.result }}" ;;
            esac
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "$stack job $result"; exit 1
            fi
          done
          echo "CI passed"
