[package]
name = "texts"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# Los textos que el servidor muestra a las personas (errores, validaciones,
# correos) en español e inglés, y el idioma de la tarea en curso. Lo fija la
# API por petición (Accept-Language) y lo leen todas las capas con `tr!`.
[dependencies]
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
