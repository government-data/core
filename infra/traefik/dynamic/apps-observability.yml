# Grafana (infra/observability, decision 0026): the installation's tool to
# read its logs and audit, on its own server and reached by URL. Same rules
# as apps.yml: a path of its own, the frame policy `app-frame-headers`,
# priority above the web's catch-all. Loki and Alloy are not routed: nothing
# outside their stack talks to them.
{{ $domain := env "APP_DOMAIN" | default "localhost" }}
{{- /* The certificate source (decision 0087): none with QD_TLS_MODE=file. */}}
{{ $resolver := "letsencrypt" }}{{ if eq (env "QD_TLS_MODE") "file" }}{{ $resolver = "" }}{{ end }}
http:
  routers:
    # Grafana serves from its subpath (serve_from_sub_path): no prefix strip.
    grafana:
      rule: "Host(`{{ $domain }}`) && PathPrefix(`/grafana`)"
      entryPoints: [websecure]
      tls:
        certResolver: "{{ $resolver }}"
      priority: 10
      service: grafana
      middlewares: [app-frame-headers]

  services:
    grafana:
      loadBalancer:
        servers:
          - url: "{{ env "GRAFANA_URL" | default "http://127.0.0.1:3000" }}"
