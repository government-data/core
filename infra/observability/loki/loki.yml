# Loki as a single binary (decision 0026): one process, its chunks and index
# in a bucket of the lake, 90 days of retention applied by its compactor.
# The variables come from the container's environment (-config.expand-env).
auth_enabled: false

server:
  http_listen_port: ${LOKI_HTTP_PORT:-3100}
  grpc_listen_port: ${LOKI_GRPC_PORT:-9095}
  log_format: json
  log_level: warn

common:
  path_prefix: /loki
  replication_factor: 1
  instance_addr: 127.0.0.1
  ring:
    kvstore:
      store: inmemory
  # The thanos object store client (decision 0066, point 12): unlike the
  # older `s3` client it can present a client certificate, which the lake's
  # gate requires; certificate.yml gives it the machine's. It reads what the
  # older client wrote (tools/verify/loki_thanos_lake.sh).
  storage:
    object_store:
      s3:
        endpoint: ${LOKI_S3_ENDPOINT}
        insecure: ${LOKI_S3_INSECURE:-false}
        bucket_name: ${LOKI_S3_BUCKET:-qd-observability}
        access_key_id: ${LOKI_S3_ACCESS_KEY}
        secret_access_key: ${LOKI_S3_SECRET_KEY}
        region: us-east-1
        bucket_lookup_type: path

storage_config:
  use_thanos_objstore: true

schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: s3
      schema: v13
      index:
        prefix: index_
        period: 24h

ingester:
  # Small installations: a chunk goes to the lake after 15 idle minutes or
  # an hour at most, so little is held only in the write-ahead log.
  chunk_idle_period: 15m
  max_chunk_age: 1h

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  delete_request_store: s3

limits_config:
  retention_period: 2160h # 90 days
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  # Room for a collector catching up with a week of logs after a restart.
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32

analytics:
  reporting_enabled: false
