# The application's Traefik with the application VM's machine certificate
# (decision 0066, points 10, 13 and 15). An overlay of docker-compose.yml,
# beside it, for an installation whose machines have certificates;
# development does not use it (gen-dev-internal.sh writes internal.crt):
#
#   docker compose -f infra/traefik/docker-compose.yml -f infra/traefik/certificate.yml up -d
#
# - machine/entrypoint.sh copies the node agent's machine.pem into the
#   watched directory as app-machine.pem, and again at each renewal, so
#   Traefik takes the renewed certificate without a restart. Its watched
#   directory is therefore writable here (still read-only in the base).
# - The internal entry point serves that certificate (internal.yml's
#   INTERNAL_CERT_FILE and INTERNAL_KEY_FILE), so INTERNAL_DOMAIN must be
#   the application VM's machine name, the only DNS name the CA gives it;
#   the serversTransport `lake` presents it to the lake's gate.
# - The services' metrics (decision 0071) are routes of the internal entry
#   point, which this VM's Alloy reaches on 443 as the machine's name
#   through the Docker host's gateway (infra/observability/certificate.yml),
#   presenting the same certificate. No port of their own (ruling 71).
# - Mimir (decision 0071, amended on 2026-11-16) is reached through the
#   `mimir` entry point, on 443 by mimir.<INTERNAL_DOMAIN> (ruling 82),
#   where every VM's Alloy pushes: any certificate of the CA may push, only
#   role `app` may read (internal.yml). Traefik reaches Mimir on its network
#   (MIMIR_UPSTREAM), presenting the same certificate; Mimir's own port is
#   published nowhere (infra/observability/certificate.yml). Loki is
#   passed through on 443 by loki.<INTERNAL_DOMAIN> to LOKI_UPSTREAM, on
#   the same network, where it does its own mTLS. The Trino coordinator is
#   passed through by trino.<INTERNAL_DOMAIN> to TRINO_UPSTREAM, where it
#   terminates its own TLS (decision 0090, ruling 90).
#
# Required environment, besides docker-compose.yml's:
#   QD_MACHINE_DIR   the application VM's node agent directory (QD_AGENT_DIR)
# Optional: QD_TRAEFIK_CHECK_EVERY (30), seconds between looks at the
# agent's machine.pem; MIMIR_UPSTREAM (https://mimir:9009), Mimir as
# Traefik reaches it; LOKI_UPSTREAM (loki:3100), Loki's address;
# TRINO_UPSTREAM (none: no route), the coordinator's TLS address, such as
# engine-trino-coordinator:443 on data-quality-edge, where the coordinator
# runs on this machine.
#
# Verified with tools/verify/traefik_app_certificate.sh; this file itself
# only by `docker compose config`.
services:
  traefik:
    # The watcher of machine/entrypoint.sh is a child of this init.
    init: true
    entrypoint: ["/etc/qd/traefik/entrypoint.sh"]
    environment:
      INTERNAL_CERT_FILE: /etc/traefik/dynamic/app-machine.pem
      INTERNAL_KEY_FILE: /etc/traefik/dynamic/app-machine.pem
      QD_TRAEFIK_CHECK_EVERY: ${QD_TRAEFIK_CHECK_EVERY:-30}
      MIMIR_UPSTREAM: ${MIMIR_UPSTREAM:-https://mimir:${MIMIR_HTTP_PORT:-9009}}
      LOKI_UPSTREAM: ${LOKI_UPSTREAM:-loki:${LOKI_HTTP_PORT:-3100}}
      TRINO_UPSTREAM: ${TRINO_UPSTREAM:-}
    volumes:
      - "./dynamic:/etc/traefik/dynamic"
      - "./machine/entrypoint.sh:/etc/qd/traefik/entrypoint.sh:ro"
      - "./machine/tls-source.sh:/etc/qd/traefik/tls-source.sh:ro"
      - "${QD_MACHINE_DIR:?set QD_MACHINE_DIR to the node agent's directory}:/run/qd-node:ro"
