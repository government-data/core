# Dolt's server settings with the machines' certificates (decision 0066,
# point 11): infra/dolt/config.yaml, the same in all but the listener, which
# serves TLS only, with the application VM's machine certificate as
# tls/entrypoint.sh copies it at each start, and requires a client
# certificate of the installation's CA. `ca_cert` is always set with
# `require_client_cert`: without it Dolt accepts a certificate of any CA
# (tools/verify/dolt_mtls.sh). Mounted in place of config.yaml by
# certificate.yml.
log_level: ${DOLT_LOG_LEVEL}
# JSON lines (`level`, `msg`, `time`), like every service (decision 0026).
log_format: json
# Long statements (a rule's YAML) are cut in the logs.
max_logged_query_len: 512

behavior:
  read_only: false
  autocommit: true
  # Dolt commits are made by the application (DOLT_COMMIT with an author),
  # never one per SQL transaction.
  dolt_transaction_commit: false
  disable_client_multi_statements: false
  # Nothing is scheduled inside the database; backups run from outside.
  event_scheduler: "OFF"
  auto_gc_behavior:
    enable: true

listener:
  # Inside the container; what is published is decided by the compose files.
  host: 0.0.0.0
  port: 3306
  # One small pool for the catalog database in the application: plenty.
  max_connections: ${DOLT_MAX_CONNECTIONS}
  back_log: 50
  max_connections_timeout_millis: 60000
  read_timeout_millis: 28800000
  write_timeout_millis: 28800000
  # The copy of the agent's machine.pem (certificate then key) and ca.crt.
  tls_cert: /run/dolt-tls/machine.pem
  tls_key: /run/dolt-tls/machine.pem
  require_secure_transport: true
  ca_cert: /run/dolt-tls/ca.crt
  require_client_cert: true

# Its metrics (decision 0071, point 7), over HTTPS with the same machine
# certificate. Dolt cannot require a client certificate here
# (require_client_cert is not a metrics setting), so the port is published
# nowhere: Traefik reaches it on its network (certificate.yml) and serves it
# on its metrics entry point, which requires one.
metrics:
  host: 0.0.0.0
  port: 11228
  tls_cert: /run/dolt-tls/machine.pem
  tls_key: /run/dolt-tls/machine.pem
  tls_ca: /run/dolt-tls/ca.crt

# Databases, users and grants, all in the data volume.
data_dir: /var/lib/dolt
cfg_dir: /var/lib/dolt/.doltcfg
privilege_file: /var/lib/dolt/.doltcfg/privileges.db
branch_control_file: /var/lib/dolt/.doltcfg/branch_control.db

system_variables:
  # No LOAD DATA or SELECT … INTO OUTFILE with the server's files.
  secure_file_priv: /nonexistent
