[package]
name = "platform"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# What the platform keeps besides identity: global secrets and connections,
# the IAM records (groups, custom policies, attachments, service accounts) and
# the license usage. Like `payments`, it knows no web framework or database
# driver: persistence is the `PlatformRepository` port, implemented in
# `infrastructure`.
[dependencies]
iam.workspace = true
async-trait.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
