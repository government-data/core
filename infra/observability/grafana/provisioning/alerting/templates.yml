# Generated by tools/grafana/alerts.mjs from
# infra/observability/grafana/definition/alerts.json and crates/texts
# (decision 0072): change those and run `pnpm run gen:grafana`, never this file.
apiVersion: 1
templates:
  - orgId: 1
    name: "qd-mail"
    template: |
      {{ define "qd.summary.es" }}{{ if or (eq .Labels.alertname "DatasourceError") (eq .Labels.alertname "DatasourceNoData") }}Métricas no disponibles: Grafana no puede evaluar la regla {{ .Labels.rulename }}{{ else }}{{ .Annotations.summary_es }}{{ end }}{{ end }}
      {{ define "qd.state.es" }}{{ if eq .Status "firing" }}activa{{ else }}resuelta{{ end }}{{ end }}
      {{ define "qd.summary.en" }}{{ if or (eq .Labels.alertname "DatasourceError") (eq .Labels.alertname "DatasourceNoData") }}Metrics not available: Grafana cannot evaluate rule {{ .Labels.rulename }}{{ else }}{{ .Annotations.summary_en }}{{ end }}{{ end }}
      {{ define "qd.state.en" }}{{ if eq .Status "firing" }}firing{{ else }}resolved{{ end }}{{ end }}
      {{ define "qd.machine" }}{{ if .CommonLabels.vm }}{{ .CommonLabels.vm }}{{ else }}sin máquina / no machine{{ end }}{{ end }}
      {{ define "qd.subject" }}[{{ if eq .Status "firing" }}ALERTA / ALERT{{ else }}RESUELTA / RESOLVED{{ end }}] {{ template "qd.machine" . }}: {{ with index .Alerts 0 }}{{ template "qd.summary.es" . }} / {{ template "qd.summary.en" . }}{{ end }}{{ end }}
      {{ define "qd.body" }}Español:
      {{ range .Alerts }}- {{ template "qd.summary.es" . }} ({{ template "qd.state.es" . }})
      {{ end }}
      English:
      {{ range .Alerts }}- {{ template "qd.summary.en" . }} ({{ template "qd.state.en" . }})
      {{ end }}{{ end }}
