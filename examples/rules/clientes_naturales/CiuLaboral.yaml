dataset: clientes_naturales
rules:
  - id: V-PN-38
    field: "CiuLaboral"
    check: "required"
    when: "ActLaboral IN ('ASALARIADO', 'TRABAJO ASOCIADO')"
    severity: blocking
    cause: capture
    alert: "Campo vacío"
    origin: { process: KNIME, node: "#1668" }

  - id: V-PN-39
    field: "CiuLaboral"
    check: "placeholder"
    values: ["ACTUALIZAR"]
    severity: major
    cause: capture
    alert: "Actualizar no coincide"
    origin: { process: KNIME, node: "#1668" }

  - id: V-PN-40
    field: "CiuLaboral"
    check: "expression"
    when: "NOT is_empty(DirComcial) AND coalesce(DirComcial, '') <> 'ACTUALIZAR'"
    fails: "is_empty(CiuLaboral) OR CiuLaboral = 'ACTUALIZAR'"
    dimension: "completeness"
    severity: blocking
    cause: capture
    alert: "Campo vacío"
    origin: { process: KNIME, node: "#1668" }

  - id: V-PN-41
    field: "CiuLaboral"
    check: "domain"
    not_in: { "list": "departamentos" }
    severity: major
    cause: capture
    alert: "Ciudad errada"
    origin: { process: KNIME, node: "#1668" }
