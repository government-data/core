# Traefik edge stack: the reverse proxy plus the routing labels that put the web
# SPA on "/" and the API on "/api", both terminated with automatic Let's Encrypt
# TLS. This file owns the Traefik configuration and the routing/middleware
# wiring; the api/web images themselves come from the Dockerfiles work item
# (infra/docker/*.Dockerfile). It runs standalone (`docker compose -f
# infra/traefik/docker-compose.yml up`) and is also meant to be composed into
# the full dev/prod stack via `include`.
name: data-quality-edge

networks:
  edge:
    name: data-quality-edge

volumes:
  letsencrypt:
  # The key that encrypts the Settings secrets (LDAP, mail, OAuth) in the
  # database. Generated the first time; back it up together with the database:
  # without it those secrets have to be typed again.
  settings-key:
  # The API's metrics file (decision 0071, point 9), which the
  # observability stack's Alloy reads: one volume of the machine, named so
  # that both projects mount the same.
  metrics:
    name: ${QD_METRICS_VOLUME:-data-quality-metrics}

services:
  traefik:
    image: ${IMAGE_TRAEFIK:-traefik:v3.6}
    restart: unless-stopped
    command:
      - "--configFile=/etc/traefik/traefik.yml"
    environment:
      # ACME registration address. Required — the stack refuses to start without
      # it, so a real contact rides on every issued certificate. Not with
      # QD_TLS_MODE, the package's certificate source (decision 0087), where
      # only `acme` needs it; Traefik with --configFile does not read this
      # variable, so the package writes the address into its static file.
      TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_EMAIL: ${ACME_EMAIL:-${QD_TLS_MODE:?set ACME_EMAIL in your environment}}
      # The name machines reach the internal entry point by: its server
      # certificate's, and the Host of its routers (internal.yml).
      INTERNAL_DOMAIN: ${INTERNAL_DOMAIN:-internal.${APP_DOMAIN:-localhost}}
    ports:
      - "80:80"
      - "443:443"
      # The machines' entry point (decision 0066) has no port of its own:
      # it is reached on 443 by INTERNAL_DOMAIN (dynamic/internal-sni.yml).
      # Nor the lake gates' check: on 443 by lakegate.<INTERNAL_DOMAIN>.
    networks:
      - edge
    volumes:
      # Read-only Docker socket: how Traefik discovers routers from labels.
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./traefik.yml:/etc/traefik/traefik.yml:ro"
      - "./dynamic:/etc/traefik/dynamic:ro"
      - "./certs:/etc/traefik/certs:ro"
      - "letsencrypt:/letsencrypt"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    environment:
      APP_HOST: "0.0.0.0"
      APP_PORT: "8080"
      # The VM's name, the `vm` of every log line (decision 0026, point 1).
      OBS_VM: ${OBS_VM:-dev}
      # LDAP / Active Directory sign-in. With an empty LDAP_URL only the local
      # accounts (the bootstrap admin) sign in. See .env.example.
      LDAP_URL: ${LDAP_URL:-}
      LDAP_STARTTLS: ${LDAP_STARTTLS:-false}
      LDAP_TLS_INSECURE: ${LDAP_TLS_INSECURE:-false}
      LDAP_CA_CERT: ${LDAP_CA_CERT:-}
      LDAP_BIND_DN: ${LDAP_BIND_DN:-}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:-}
      LDAP_BASE_DN: ${LDAP_BASE_DN:-}
      LDAP_USER_FILTER: ${LDAP_USER_FILTER:-}
      LDAP_ADMIN_GROUPS: ${LDAP_ADMIN_GROUPS:-}
      # Sign-in limits (local and directory accounts). Empty, the API uses its
      # defaults: 10 attempts/60 s per IP and per email; lockout after 5
      # failures, from 60 s doubling up to 3600 s.
      LOGIN_RATE_LIMIT_MAX_REQUESTS: ${LOGIN_RATE_LIMIT_MAX_REQUESTS:-10}
      LOGIN_RATE_LIMIT_WINDOW_SECS: ${LOGIN_RATE_LIMIT_WINDOW_SECS:-60}
      # The install routes that check a machine's join token (its compose
      # file, entrypoints, a lake's root keys), per IP: a lake replica's
      # join.sh makes four. Empty, 30 per 60 s. Joining keeps the limit above.
      INSTALL_RATE_LIMIT_MAX_REQUESTS: ${INSTALL_RATE_LIMIT_MAX_REQUESTS:-30}
      INSTALL_RATE_LIMIT_WINDOW_SECS: ${INSTALL_RATE_LIMIT_WINDOW_SECS:-60}
      ADMIN_LOCKOUT_MAX_ATTEMPTS: ${ADMIN_LOCKOUT_MAX_ATTEMPTS:-5}
      ADMIN_LOCKOUT_BASE_SECONDS: ${ADMIN_LOCKOUT_BASE_SECONDS:-60}
      ADMIN_LOCKOUT_MAX_SECONDS: ${ADMIN_LOCKOUT_MAX_SECONDS:-3600}
      # Password policy of the local accounts (the first admin and new
      # passwords on recovery): minimum length and what it must contain.
      ADMIN_PASSWORD_MIN_LENGTH: ${ADMIN_PASSWORD_MIN_LENGTH:-12}
      ADMIN_PASSWORD_REQUIRE_UPPERCASE: ${ADMIN_PASSWORD_REQUIRE_UPPERCASE:-true}
      ADMIN_PASSWORD_REQUIRE_LOWERCASE: ${ADMIN_PASSWORD_REQUIRE_LOWERCASE:-true}
      ADMIN_PASSWORD_REQUIRE_DIGIT: ${ADMIN_PASSWORD_REQUIRE_DIGIT:-true}
      ADMIN_PASSWORD_REQUIRE_SYMBOL: ${ADMIN_PASSWORD_REQUIRE_SYMBOL:-false}
      # Password recovery: how many minutes the email's link works, and the
      # UI's public address it points to (empty, OAUTH_REDIRECT_BASE without
      # "/api").
      PASSWORD_RESET_TTL_MINUTES: ${PASSWORD_RESET_TTL_MINUTES:-30}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-https://${APP_DOMAIN:-localhost}}
      # Where a joined machine's Alloy pushes its metrics, given in its join
      # command (decision 0071, point 14): Mimir on the observability server,
      # by default the application VM's, named as its certificate names it.
      MACHINES_METRICS_PUSH_URL: ${MACHINES_METRICS_PUSH_URL:-https://${INTERNAL_DOMAIN:-internal.${APP_DOMAIN:-localhost}}:${MIMIR_HTTP_PORT:-9009}/api/v1/push}
      # Where the API asks each installed application module for its drain
      # (decision 0003): /modules/<name><drain_path> on Traefik's internal
      # entry point, with the VM's machine certificate (LAKE_CLIENT_CERT_FILE).
      INTERNAL_DOMAIN: ${INTERNAL_DOMAIN:-internal.${APP_DOMAIN:-localhost}}
      TRAEFIK_INTERNAL_PORT: ${TRAEFIK_INTERNAL_PORT:-443}
      # Settings editable from the UI (LDAP, mail, OAuth): the secrets are
      # encrypted with SETTINGS_ENCRYPTION_KEY or, empty, with the settings-key
      # volume's key. What is saved there wins over LDAP_* / OAUTH_*.
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:-}
      SETTINGS_KEY_FILE: /var/lib/quality-data/settings/settings.key
      # The API's public origin (Traefik strips "/api"): each OAuth provider's
      # redirect URL is <this>/auth/oauth/<id>/callback.
      OAUTH_REDIRECT_BASE: ${OAUTH_REDIRECT_BASE:-https://${APP_DOMAIN:-localhost}/api}
      # This installation as an OIDC provider for other applications: empty, off.
      # The key comes from `server oidc-keygen`; the applications, from `server oidc-client`.
      OIDC_SIGNING_KEY: ${OIDC_SIGNING_KEY:-}
      OIDC_SIGNING_KEY_PREVIOUS: ${OIDC_SIGNING_KEY_PREVIOUS:-}
      # ES256 (`server oidc-keygen --es256`), for the clients that read only
      # RSA or EC keys: empty, those clients get no token.
      OIDC_SIGNING_KEY_ES256: ${OIDC_SIGNING_KEY_ES256:-}
      OIDC_SIGNING_KEY_ES256_PREVIOUS: ${OIDC_SIGNING_KEY_ES256_PREVIOUS:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
    volumes:
      - settings-key:/var/lib/quality-data/settings
      - metrics:/run/qd-metrics
    networks:
      - edge
    expose:
      - "8080"
    # Its routers' certificate resolver, by the certificate source (decision
    # 0087): without QD_TLS_MODE, Let's Encrypt as always.
    label_file: ./tls-source/${QD_TLS_MODE:-acme}-api.labels
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=data-quality-edge"
      # API router: Host + "/api" prefix, higher priority so it wins over the
      # web catch-all. The api-chain middleware strips "/api", rate-limits,
      # applies security headers and compresses. The machines' routes
      # (/api/internal/machines/…) and the update agent's (/api/updater/…)
      # are not served here: only on the internal entry point, with a client
      # certificate (infra/traefik/internal.yml).
      - "traefik.http.routers.api.rule=Host(`${APP_DOMAIN:-localhost}`) && PathPrefix(`/api`) && !PathPrefix(`/api/internal/machines/`) && !PathPrefix(`/api/updater/`) && !PathPrefix(`/api/v1/`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.priority=100"
      - "traefik.http.routers.api.middlewares=api-chain@file"
      - "traefik.http.services.api.loadbalancer.server.port=8080"
      # The live notices (SSE) on their own router: the connection stays open
      # and must not count as an in-flight request nor be compressed (see
      # api-events-chain).
      - "traefik.http.routers.api-events.rule=Host(`${APP_DOMAIN:-localhost}`) && Path(`/api/events`)"
      - "traefik.http.routers.api-events.entrypoints=websecure"
      - "traefik.http.routers.api-events.priority=200"
      - "traefik.http.routers.api-events.service=api"
      - "traefik.http.routers.api-events.middlewares=api-events-chain@file"

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
    restart: unless-stopped
    networks:
      - edge
    # As the API's (decision 0087).
    label_file: ./tls-source/${QD_TLS_MODE:-acme}-web.labels
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=data-quality-edge"
      # Web router: catch-all for the host, lowest priority so "/api" wins.
      - "traefik.http.routers.web.rule=Host(`${APP_DOMAIN:-localhost}`)"
      - "traefik.http.routers.web.entrypoints=websecure"
      - "traefik.http.routers.web.priority=1"
      - "traefik.http.routers.web.middlewares=web-chain@file"
      # The web image runs nginx unprivileged (non-root), listening on 8080.
      - "traefik.http.services.web.loadbalancer.server.port=8080"
