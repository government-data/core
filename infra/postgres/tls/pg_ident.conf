# A worker's certificate is the queue's role (decision 0066, point 7): its
# subject, as PostgreSQL writes it for `clientname=DN` (RFC 2253, CN first),
# is `CN=<machine>,OU=worker,O=qd`, the subject the installation's CA gives
# a machine of the role `worker`. No other subject maps to anything.
# Whether that machine may work is the queue's to say (its state in
# `machines`, crates/quality/migrations/0024_queue_machines.sql).

# MAPNAME  SYSTEM-USERNAME                      PG-USERNAME
workers    "/^CN=[a-z0-9-]+,OU=worker,O=qd$"    qd_queue

# The application VM's certificate (`CN=<machine>,OU=app,O=qd`) is the
# metrics' role (decision 0071): Alloy's exporter on that VM. It reads
# statistics only (initdb/30-metrics-role.sh).
metrics    "/^CN=[a-z0-9-]+,OU=app,O=qd$"       qd_metrics
