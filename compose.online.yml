# Online edition: a cell behind CloudFront + AWS WAF (infra/aws/borde.tf).
# It goes over the production one:
#
#   docker compose -f compose.yml -f compose.prod.yml -f compose.online.yml --profile prod up -d
#
# Requires:
#   ORQ_DOMINIO         orquestador.app: each company signs in at <company>.orquestador.app
#   AWS_HOSTED_ZONE_ID  the domain's Route 53 zone: the wildcard certificate
#                       *.ORQ_DOMINIO comes through DNS-01 (with AWS_ACCESS_KEY_ID and
#                       AWS_SECRET_ACCESS_KEY, or the instance's role)
#   ORQ_ORIGEN_SECRETO  terraform output -json borde_secreto_origen
#   ORQ_NUBE            the licensing cloud (https://licencias.orquestador.app)
#   ORQ_LICENSE_KEY     the cell's key (online edition, from the gestión panel): with
#                       it the cell receives the mail server configured in gestión
#                       → Correo and sets it up in each company without its own
#
# Without the secret header no router answers: the cell cannot be reached
# bypassing the edge.
name: knime-orchestador

services:
  traefik:
    environment:
      AWS_HOSTED_ZONE_ID: ${AWS_HOSTED_ZONE_ID:?AWS_HOSTED_ZONE_ID is missing}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
    volumes:
      - "./infra/traefik/online/traefik.yml:/etc/traefik/traefik.yml:ro"
      - "./infra/traefik/online/cdn.yml:/etc/traefik/dynamic/cdn.yml:ro"

  api:
    environment:
      ORQ_EDITION: online
      ORQ_DOMINIO: ${ORQ_DOMINIO:?ORQ_DOMINIO is missing}
      # The platform's mail is sent by gestión: each company's is optional.
      ORQ_NUBE: ${ORQ_NUBE:?ORQ_NUBE is missing}
      ORQ_LICENSE_KEY: ${ORQ_LICENSE_KEY:?ORQ_LICENSE_KEY is missing}
      ORQ_INSTALLATION_ID: ${ORQ_INSTALLATION_ID:-${ORQ_DOMINIO}}
    labels:
      - "traefik.http.routers.api.rule=HostRegexp(`^[a-z0-9-]+\\.${ORQ_DOMINIO}$$`) && PathPrefix(`/api`) && !PathPrefix(`/api/internal/machines/`) && Header(`X-Origen-Secreto`, `${ORQ_ORIGEN_SECRETO:?ORQ_ORIGEN_SECRETO is missing}`)"
      - "traefik.http.routers.api.tls.domains[0].main=${ORQ_DOMINIO}"
      - "traefik.http.routers.api.tls.domains[0].sans=*.${ORQ_DOMINIO}"
      - "traefik.http.routers.api.middlewares=api-chain-cdn@file"
      - "traefik.http.routers.api-events.rule=HostRegexp(`^[a-z0-9-]+\\.${ORQ_DOMINIO}$$`) && Path(`/api/events`) && Header(`X-Origen-Secreto`, `${ORQ_ORIGEN_SECRETO}`)"
      - "traefik.http.routers.api-events.tls.domains[0].main=${ORQ_DOMINIO}"
      - "traefik.http.routers.api-events.tls.domains[0].sans=*.${ORQ_DOMINIO}"
      - "traefik.http.routers.api-events.middlewares=api-events-chain-cdn@file"

  web:
    labels:
      - "traefik.http.routers.web.rule=HostRegexp(`^[a-z0-9-]+\\.${ORQ_DOMINIO}$$`) && Header(`X-Origen-Secreto`, `${ORQ_ORIGEN_SECRETO}`)"
      - "traefik.http.routers.web.tls.domains[0].main=${ORQ_DOMINIO}"
      - "traefik.http.routers.web.tls.domains[0].sans=*.${ORQ_DOMINIO}"
      - "traefik.http.routers.web.middlewares=web-chain-cdn@file"
      # The documentation (/docs) belongs to the local installation: it is not served here.
      - "traefik.http.routers.docs-no.rule=HostRegexp(`^[a-z0-9-]+\\.${ORQ_DOMINIO}$$`) && PathPrefix(`/docs`) && Header(`X-Origen-Secreto`, `${ORQ_ORIGEN_SECRETO}`)"
      - "traefik.http.routers.docs-no.tls.domains[0].main=${ORQ_DOMINIO}"
      - "traefik.http.routers.docs-no.tls.domains[0].sans=*.${ORQ_DOMINIO}"
      - "traefik.http.routers.docs-no.entrypoints=websecure"
      - "traefik.http.routers.docs-no.priority=50"
      - "traefik.http.routers.docs-no.service=web"
      - "traefik.http.routers.docs-no.middlewares=docs-closed@file"
