# One published port (ruling 71; decision 0091): the machines' entry point
# `internal` is on Traefik's loopback only (traefik.yml), reached on 443
# (`websecure`) by its name. A TLS connection whose SNI is INTERNAL_DOMAIN
# is passed through as it comes, not terminated here, to `internal`, which
# requires the client certificate of the installation's CA with its own TLS
# options, timeouts and routers (internal.yml), as before. The PROXY
# protocol (v2) gives it the client's address. Any other name, or none, is
# the web's: no router there answers for INTERNAL_DOMAIN, so a handshake
# for the public name followed by `Host: <INTERNAL_DOMAIN>` gets 404
# (tools/verify/traefik_one_port.sh). The lake gates' check is the same
# for its own name, lakegate.<INTERNAL_DOMAIN> (the application machine's
# certificate carries it), to the gates' entry point `lakegate`, the one
# that keeps the gate's forwarded headers. Mimir's `mimir` entry point is
# reached the same way by mimir.<INTERNAL_DOMAIN>, and Loki, which does its
# own mTLS with the same certificate, by loki.<INTERNAL_DOMAIN> at
# LOKI_UPSTREAM (ruling 82; both only where the observability stack runs).
{{ $internal := env "INTERNAL_DOMAIN" | default "internal.localhost" }}
tcp:
  routers:
    internal-entry:
      rule: "HostSNI(`{{ $internal }}`)"
      entryPoints: [websecure]
      tls:
        passthrough: true
      service: internal-entry
    lakegate-entry:
      rule: "HostSNI(`lakegate.{{ $internal }}`)"
      entryPoints: [websecure]
      tls:
        passthrough: true
      service: lakegate-entry
{{- if env "MIMIR_UPSTREAM" }}
    mimir-entry:
      rule: "HostSNI(`mimir.{{ $internal }}`)"
      entryPoints: [websecure]
      tls:
        passthrough: true
      service: mimir-entry
{{- end }}
{{- if env "LOKI_UPSTREAM" }}
    loki-entry:
      rule: "HostSNI(`loki.{{ $internal }}`)"
      entryPoints: [websecure]
      tls:
        passthrough: true
      service: loki-entry
{{- end }}
  services:
    internal-entry:
      loadBalancer:
        serversTransport: internal-entry
        servers:
          - address: "127.0.0.1:9443"
    lakegate-entry:
      loadBalancer:
        serversTransport: internal-entry
        servers:
          - address: "127.0.0.1:9444"
{{- if env "MIMIR_UPSTREAM" }}
    mimir-entry:
      loadBalancer:
        serversTransport: internal-entry
        servers:
          - address: "127.0.0.1:9446"
{{- end }}
{{- if env "LOKI_UPSTREAM" }}
    loki-entry:
      loadBalancer:
        servers:
          - address: "{{ env "LOKI_UPSTREAM" }}"
{{- end }}
  serversTransports:
    internal-entry:
      proxyProtocol:
        version: 2
