# Who may connect, and how, with TLS on (infra/postgres/tls.yml; decisions
# 0023, 0066 points 7 and 12). The first line that matches decides; a
# failure does not fall through to the next one.
#
# - The container's own socket, as the image's default: the init scripts,
#   the healthcheck (`pg_isready`), `docker compose exec … psql`.
# - Nothing over TCP without TLS, from anywhere.
# - The queue's role only with a worker's certificate of the installation's
#   CA (`ssl_ca_file`), mapped by its subject in pg_ident.conf; it has no
#   password.
# - The metrics' role (decision 0071) only with the application VM's
#   certificate (tls/pg_ident.conf), to the `postgres` database alone; it
#   has no password: Alloy's exporter on that VM.
# - Every other role over TLS with its password (the API, the backups).

# TYPE     DATABASE  USER      ADDRESS  METHOD
local      all       all                trust
hostnossl  all       all       all      reject
hostssl    all       qd_queue  all      cert clientname=DN map=workers
hostssl    postgres  qd_metrics  all    cert clientname=DN map=metrics
hostssl    all       all       all      scram-sha-256
