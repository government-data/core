# Development only. The API runs on the host (watch mode), so Dolt publishes
# its MySQL port on the host's loopback, never further: the default
# `DOLT_URL` is mysql://qd_app:…@127.0.0.1:3307 (3306 is often taken by a
# local MySQL). The copy of the backups joins the network namespace of the
# application's Traefik, where the lake's RustFS listens on 127.0.0.1:9000
# (see infra/rustfs/compose.dev.yml). Only the network is shared, and only here.
# Dolt also joins the application's Traefik network, where Traefik reaches
# its metrics port (config.yaml; decision 0071): start the application's
# stack first.
networks:
  edge:
    external: true
    name: data-quality-edge

services:
  dolt:
    ports:
      - "127.0.0.1:${DOLT_PORT:-3307}:3306"
    networks:
      - default
      - edge

  backup-sync:
    network_mode: "container:${APP_STACK:-data-quality}-traefik-1"
