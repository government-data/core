# Who may connect during the first start (tls/entrypoint.sh; decision 0066,
# point 16): PostgreSQL listens on 127.0.0.1 alone and without TLS until
# the node agent's machine.pem is there. The first line that matches
# decides; what matches none is refused.
#
# - The container's own socket, as tls/pg_hba.conf: the init scripts, the
#   healthcheck, `docker compose exec … psql`.
# - Its loopback, with a password: `server app-machine` in this container's
#   network namespace (app-machine.yml), as the application's role.

# TYPE  DATABASE  USER  ADDRESS       METHOD
local   all       all                 trust
host    all       all   127.0.0.1/32  scram-sha-256
