[package]
name = "application"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# The application layer orchestrates use cases. It depends on the domain crates
# (`domain` for auth/sessions) — never on `infrastructure` or `api`. It knows nothing about HTTP or storage;
# it wires domain ports into application services.
[dependencies]
schedule-core.workspace = true
async-trait.workspace = true
domain.workspace = true
auth-gateway.workspace = true
# The lake's grant (decision 0078; `application` may depend on `contracts`,
# a pure crate: the user's ruling of 2026-11-23).
contracts.workspace = true
# Secrets, global roles and license usage.
platform.workspace = true
# Global capabilities and roles (ADR 0013).
iam.workspace = true
texts.workspace = true
# The local time in the failure emails.
chrono-tz.workspace = true
chrono.workspace = true
serde_json.workspace = true
# Structured log events for use-case-level failures (e.g. a webhook that could
# not be applied), emitted through the same `tracing` pipeline as the API layer.
tracing.workspace = true
# `sync` to hand the change notices to the open tabs.
tokio = { workspace = true, features = ["sync"] }
serde.workspace = true
# A module role's files are checked against their SHA-256 (quality-sdk
# decision 0013).
base64.workspace = true
sha2.workspace = true

# Test-only: a stub port needs `async-trait` to implement the async `HealthCheck`
# contract, and `tokio` provides the runtime for `#[tokio::test]`.
[dev-dependencies]
auth-gateway = { workspace = true, features = ["testing"] }
async-trait.workspace = true
tokio.workspace = true
