[package]
name = "contracts"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# The pluggable-module contract. This is the ONE crate that every feature
# module and the composition root (`server`) share: modules implement the
# `Module` trait declared here and never depend on one another. It depends on
# `axum` because a module's contract is to expose an axum `Router`; it holds no
# domain model and no business logic of its own.
[dependencies]
axum.workspace = true
# The caller's audit log is asynchronous (src/access.rs).
async-trait.workspace = true
# A module's routes for people, in the OpenAPI document (src/module.rs).
utoipa.workspace = true
# A view's purpose, as the API speaks it (src/view.rs); a lake grant
# (src/lake_grant.rs).
serde.workspace = true

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
