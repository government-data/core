# Floci: local AWS (S3, ECR, EC2, Route 53, SSM, SES, Cost Explorer…) to test
# what infra/aws creates and the licensing cloud without deploying. The
# resources live in memory: they are lost when the container is recreated;
# seed.sh creates them again. Lambda, ECS and the ECR registry run as
# containers of this machine, hence the Docker socket.
name: floci

services:
  floci:
    image: floci/floci:2.3.0
    container_name: floci
    restart: unless-stopped
    ports:
      - "127.0.0.1:4566:4566"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
