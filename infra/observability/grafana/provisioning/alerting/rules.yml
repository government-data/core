        condition: "C"
        data:
          - refId: "A"
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "mimir"
            model:
              refId: "A"
              expr: "node_filesystem_avail_bytes{role!=\"worker\"} / node_filesystem_size_bytes{role!=\"worker\"}"
              instant: true
              range: false
          - refId: "C"
            datasourceUid: "__expr__"
            model:
              refId: "C"
              type: "threshold"
              expression: "A"
              conditions:
                - evaluator:
                    type: "lt"
                    params: [0.1]
        noDataState: "OK"
        execErrState: "Error"
        for: "5m"
        annotations:
          summary_es: "Queda poco disco en {{ $labels.vm }} ({{ $labels.mountpoint }}): {{ humanizePercentage $values.A.Value }} libre, menos de 10 %"
          summary_en: "Disk almost full on {{ $labels.vm }} ({{ $labels.mountpoint }}): {{ humanizePercentage $values.A.Value }} free, under 10 %"
